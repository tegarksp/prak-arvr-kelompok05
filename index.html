<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AR Kelompok 5 - Minggu 2 (Scene v1)</title>
<!-- Library A-Frame dan AR.js (versi sesuai modul) -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: true;">

  <!-- ===== PENCAHAYAAN ===== -->
  <!-- Lampu ambient: cahaya merata ke seluruh objek -->
  <a-light id="lampu-ambient" type="ambient" color="#ffffff" intensity="0.6"></a-light>
  <!-- Lampu directional: cahaya searah, seperti matahari -->
  <a-light id="lampu-directional" type="directional" color="#ffffff" intensity="0.8" position="1 3 2"></a-light>

  <!-- ===== SCENE UTAMA (menempel pada marker Hiro) ===== -->
  <a-marker preset="hiro">

    <!-- Alas: bidang datar, diputar -90 derajat agar rebah di atas marker -->
    <a-plane id="alas" position="0 0 0" rotation="-90 0 0" width="2" height="2"
             color="#e9e5fa" opacity="0.7" transparent="true"></a-plane>

    <!-- Kelompok kampus: miniatur kampus dikumpulkan dalam satu entity induk -->
    <a-entity id="kelompok-kampus" position="0 0 0" scale="1 1 1">

      <!-- Gedung kampus: kotak bertekstur di tengah -->
      <a-box id="gedung-kampus" position="0 0.3 0" width="0.6" height="0.6" depth="0.6"
             src="assets/tekstur.jpg"></a-box>

      <!-- Atap gedung: kerucut di atas kotak -->
      <a-cone id="atap-gedung" position="0 0.75 0" radius-bottom="0.42" radius-top="0"
              height="0.3" color="#8B2E2E"></a-cone>

      <!-- Pohon: batang silinder + tajuk bola hijau (diam) -->
      <a-cylinder id="batang-pohon" position="0.7 0.1 0" radius="0.04" height="0.2"
                  color="#6B4226"></a-cylinder>
      <a-sphere id="tajuk-pohon" position="0.7 0.3 0" radius="0.12"
                color="#2E8B57"></a-sphere>

      <!-- Bola biru: bergerak naik-turun -->
      <a-sphere id="bola-biru" position="-0.7 0.3 0" radius="0.12"
                color="#1E88E5"
                animation="property: position; dir: alternate; to: -0.7 0.6 0; dur: 1500; loop: true"></a-sphere>

    </a-entity>

  </a-marker>

  <!-- Kamera: diperlukan agar scene dirender dari sudut pandang pengamat -->
  <a-entity camera></a-entity>

</a-scene>
</body>
</html>
